<div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
  <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-xl">

    <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">
      Iniciar Sesión - Admin
    </h1>

    <form (ngSubmit)="onSubmit()" class="space-y-4">

      <div>
        <label class="block text-sm text-slate-600 mb-1">Correo</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm text-slate-600 mb-1">Contraseña</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700"
      >
        Entrar
      </button>

      <p *ngIf="errorMessage" class="text-red-500 text-center text-sm">
        {{ errorMessage }}
      </p>
    </form>

  </div>
</div>
